<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Test chat</title>
<style>
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --text: #1c1c22; --muted: #6d6d78;
    --me: #2f6fed; --me-text: #ffffff; --her: #e7e7ec; --her-text: #1c1c22;
    --line: #dcdce2; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121216; --panel: #1b1b21; --text: #ececf1; --muted: #9a9aa6;
      --me: #3b78f0; --me-text: #ffffff; --her: #2a2a32; --her-text: #ececf1;
      --line: #2e2e36; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header .who { flex: 1; min-width: 0; }
  header .name { font-weight: 600; }
  header .status { font-size: 13px; color: var(--muted); }
  header button {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .her { align-self: flex-start; background: var(--her); color: var(--her-text); border-bottom-left-radius: 4px; }
  .note { align-self: center; font-size: 13px; color: var(--muted); text-align: center; max-width: 90%; }
  .note.warn { color: var(--warn); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 12px; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; outline: none;
  }
  input:focus { border-color: var(--me); }
  form button {
    font: inherit; font-weight: 600; border: none; border-radius: 20px; padding: 0 18px;
    background: var(--me); color: var(--me-text); cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  #login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .box { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  #login h1 { font-size: 18px; margin: 0 0 12px; }
  #login form { padding: 0; border: none; background: none; flex-direction: column; }
  #login form button { padding: 10px; }
  #login .err { color: var(--warn); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Test chat</h1>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="Лозинка" autocomplete="current-password" required>
      <button type="submit">Влез</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<header id="top" class="hidden">
  <div class="who">
    <div class="name">Jessica</div>
    <div class="status" id="status">тест, ништо не се праќа надвор</div>
  </div>
  <button id="resetBtn" type="button" title="Избриши го разговорот">Нов разговор</button>
  <button id="logoutBtn" type="button" title="Одјави се">Излез</button>
</header>
<div id="log" class="hidden"></div>
<form id="chatForm" class="hidden">
  <input id="text" type="text" placeholder="Пиши како фан…" autocomplete="off" maxlength="2000">
  <button id="sendBtn" type="submit">Прати</button>
</form>

<script>
(function () {
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };
  var server = null;
  var password = store.get('om_pw');
  var session = store.get('om_session');
  if (!session) {
    session = 'g' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    store.set('om_session', session);
  }

  function loadServer() {
    if (server) return Promise.resolve(server);
    return fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (c) { server = c.server; return server; });
  }

  function call(payload) {
    return loadServer().then(function (url) {
      payload.password = password;
      payload.sessionId = session;
      // text/plain keeps this a "simple" request, so the browser sends no CORS preflight.
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
    }).then(function (r) {
      if (r.status === 401) { var e = new Error('wrong_password'); e.code = 401; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function add(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
    return d;
  }

  function showChat() {
    $('login').classList.add('hidden');
    ['top', 'log', 'chatForm'].forEach(function (id) { $(id).classList.remove('hidden'); });
    if (!$('log').children.length) add('note', 'Пиши како фан. Ботот одговара за неколку секунди, првиот одговор може да трае до половина минута.');
    $('text').focus();
  }

  function showLogin(msg) {
    $('login').classList.remove('hidden');
    ['top', 'log', 'chatForm'].forEach(function (id) { $(id).classList.add('hidden'); });
    $('loginErr').textContent = msg || '';
    $('pw').value = '';
    $('pw').focus();
  }

  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    password = $('pw').value;
    $('loginErr').textContent = 'Проверувам…';
    call({ ping: true }).then(function () {
      store.set('om_pw', password);
      showChat();
    }).catch(function (e) {
      showLogin(e.code === 401 ? 'Погрешна лозинка.' : 'Серверот не одговара. Компјутерот со ботот можеби е исклучен.');
    });
  });

  var busy = false;
  $('chatForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = $('text').value.trim();
    if (!text || busy) return;
    $('text').value = '';
    add('msg me', text);
    busy = true;
    $('sendBtn').disabled = true;
    var typing = add('typing', 'Jessica пишува…');
    call({ text: text }).then(function (r) {
      typing.remove();
      if (r.system) { add('note', r.reply); return; }
      if (r.reply) {
        // Each line is a separate short text, the way she would send them.
        r.reply.split('\n').filter(Boolean).forEach(function (line) { add('msg her', line); });
        if (r.offer) add('note', 'понуда: ' + r.offer.media_id + ' за $' + r.offer.price);
      } else {
        add('note warn', 'Ботот не одговара на ова, би одело кај човек (намера: ' + (r.intent || 'непозната') + ').');
      }
    }).catch(function (e) {
      typing.remove();
      if (e.code === 401) { store.del('om_pw'); showLogin('Лозинката повеќе не важи.'); return; }
      add('note warn', 'Пораката не стигна до ботот. Обиди се пак.');
    }).then(function () {
      busy = false;
      $('sendBtn').disabled = false;
      $('text').focus();
    });
  });

  $('resetBtn').addEventListener('click', function () {
    call({ text: '/reset' }).then(function () {
      $('log').innerHTML = '';
      add('note', 'Разговорот е избришан. Почни одново.');
    }).catch(function () { add('note warn', 'Не успеав да го избришам разговорот.'); });
  });

  $('logoutBtn').addEventListener('click', function () {
    store.del('om_pw');
    password = null;
    $('log').innerHTML = '';
    showLogin('');
  });

  if (password) {
    call({ ping: true }).then(showChat).catch(function (e) {
      if (e.code === 401) store.del('om_pw');
      showLogin(e.code === 401 ? '' : 'Серверот не одговара. Компјутерот со ботот можеби е исклучен.');
    });
  } else {
    showLogin('');
  }
})();
</script>
</body>
</html>
